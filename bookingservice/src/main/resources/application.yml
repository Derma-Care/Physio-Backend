spring:
  application:
    name: bookingservice

  data:
    mongodb:
      uri: mongodb://localhost:27017/customerAppointments?connectTimeoutMS=30000&socketTimeoutMS=60000
      auto-index-creation: false

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 30000
            readTimeout: 60000
            loggerLevel: FULL   # detailed logs for debugging

server:
  port: 9900
  servlet:
    context-path: /api
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

# =========================================================
# WHATSAPP (dummy values for local dev)
# =========================================================
whatsapp:
  base-url: http://localhost:8080/mock-whatsapp
  auth-key: dummy-key
  phone-number-id: test-id
  booking-confirmation-template-id: test-template

# =========================================================
# AWS S3 (test bucket for local dev)
# =========================================================
aws:
  accessKeyId: local-access
  secretAccessKey: local-secret
  region: ap-south-1
  s3:
    bucket: physiocare-dev-storage

# =========================================================
# EUREKA (local discovery)
# =========================================================
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# =========================================================
# RESILIENCE4J (local testing thresholds)
# =========================================================
resilience4j:
  circuitbreaker:
    instances:
      bookingService:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
  timelimiter:
    instances:
      bookingService:
        timeout-duration: 60s

# =========================================================
# ACTUATOR (local monitoring)
# =========================================================
management:
  server:
    base-path: /
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# =========================================================
# INFO
# =========================================================
info:
  app:
    name: bookingservice
    description: Service responsible for booking appointments (local profile)
    version: 1.0.0

# =========================================================
# LOGGING (verbose for dev)
# =========================================================
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.dermaCare.bookingService: DEBUG
