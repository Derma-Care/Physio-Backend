spring:
  application:
    name: bookingservice

#  config:
#    import: optional:application-secrets.yml

  data:
    mongodb:
      uri: mongodb://localhost:27017/customerAppointments?connectTimeoutMS=30000&socketTimeoutMS=60000

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 30000
            readTimeout: 60000

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 9900

  servlet:
    context-path: /api

  shutdown: graceful

  compression:
    enabled: true
    mime-types:
      - application/json
      - text/html
      - text/plain

