# =========================================================
# APPLICATION
# =========================================================

spring.application.name=adminservice
server.port=8081

# =========================================================
# SERVER
# =========================================================

server.connection-timeout=90s

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Compression
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain
server.compression.min-response-size=1024

# =========================================================
# EUREKA
# =========================================================

eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Docker / Production
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true

# =========================================================
# MONGODB
# =========================================================

spring.data.mongodb.uri=mongodb://localhost:27017/AdminService?connectTimeoutMS=30000&socketTimeoutMS=60000

# =========================================================
# STATIC FILES
# =========================================================

spring.mvc.static-path-pattern=/derma-care/media/**

spring.web.resources.static-locations=file:videos/,file:images/

app.video.folder=videos/
app.video.base-url=http://localhost:8081/derma-care/media/videos/

app.image.folder=images/
app.image.base-url=http://localhost:8081/derma-care/media/images/

# =========================================================
# MAIL
# =========================================================

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}

spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

spring.mail.protocol=smtp

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.mail.debug=false

# =========================================================
# FEIGN TIMEOUTS
# =========================================================

spring.cloud.openfeign.client.config.default.connectTimeout=30000
spring.cloud.openfeign.client.config.default.readTimeout=60000

# =========================================================
# RESILIENCE4J
# =========================================================

resilience4j.circuitbreaker.instances.circuitBreaker.failure-rate-threshold=80

resilience4j.circuitbreaker.instances.circuitBreaker.sliding-window-size=10

resilience4j.circuitbreaker.instances.circuitBreaker.sliding-window-type=COUNT_BASED

resilience4j.circuitbreaker.instances.circuitBreaker.minimum-number-of-calls=5

resilience4j.circuitbreaker.instances.circuitBreaker.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.circuitBreaker.permitted-number-of-calls-in-half-open-state=4

resilience4j.circuitbreaker.instances.circuitBreaker.wait-duration-in-open-state=1m

# =========================================================
# RESILIENCE4J TIME LIMITER
# =========================================================

resilience4j.timelimiter.instances.circuitBreaker.timeout-duration=60s

# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# =========================================================
# LOGGING
# =========================================================

logging.level.root=INFO
logging.level.org.springframework.data.mongodb=INFO