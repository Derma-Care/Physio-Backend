# =========================================================
# APPLICATION
# =========================================================

spring.application.name=adminservice
server.port=8081

# =========================================================
# SERVER
# =========================================================

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Compression
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain
server.compression.min-response-size=1024

# =========================================================
# EUREKA
# =========================================================

eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true

# =========================================================
# MONGODB
# =========================================================

spring.data.mongodb.uri=mongodb://localhost:27017/AdminService?connectTimeoutMS=30000&socketTimeoutMS=60000

# =========================================================
# STATIC FILES
# =========================================================

spring.mvc.static-path-pattern=/derma-care/media/**

spring.web.resources.static-locations=file:videos/,file:images/

app.video.folder=videos/
app.video.base-url=http://localhost:8081/derma-care/media/videos/

app.image.folder=images/
app.image.base-url=http://localhost:8081/derma-care/media/images/

# =========================================================
# MAIL
# =========================================================

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}

spring.mail.username=${SPRING_MAIL_USERNAME:dermacare382@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:ejavgihpzhyfsiaz}

spring.mail.protocol=smtp

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.mail.debug=false

# =========================================================
# FEIGN TIMEOUTS
# =========================================================

spring.cloud.openfeign.client.config.default.connectTimeout=30000
spring.cloud.openfeign.client.config.default.readTimeout=60000

# =========================================================
# RESILIENCE4J BOOKING CONFIG
# =========================================================
resilience4j.circuitbreaker.instances.bookingService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bookingService.sliding-window-size=10
resilience4j.circuitbreaker.instances.bookingService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.bookingService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.bookingService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.bookingService.permitted-number-of-calls-in-half-open-state=4
resilience4j.circuitbreaker.instances.bookingService.wait-duration-in-open-state=1m

# Record these exceptions as failures
resilience4j.circuitbreaker.instances.bookingService.record-exceptions[0]=java.lang.Exception
resilience4j.circuitbreaker.instances.bookingService.record-exceptions[1]=feign.FeignException
resilience4j.circuitbreaker.instances.bookingService.record-exceptions[2]=java.io.IOException
resilience4j.circuitbreaker.instances.bookingService.record-exceptions[3]=java.util.concurrent.TimeoutException

# Ignore these exceptions
resilience4j.circuitbreaker.instances.bookingService.ignore-exceptions[0]=java.lang.IllegalArgumentException
resilience4j.circuitbreaker.instances.bookingService.ignore-exceptions[1]=org.springframework.web.bind.MethodArgumentNotValidException
resilience4j.circuitbreaker.instances.bookingService.ignore-exceptions[2]=org.springframework.web.server.ResponseStatusException

resilience4j.retry.instances.bookingService.max-attempts=3
resilience4j.retry.instances.bookingService.wait-duration=2s

resilience4j.ratelimiter.instances.bookingService.limit-for-period=20
resilience4j.ratelimiter.instances.bookingService.limit-refresh-period=1s
resilience4j.ratelimiter.instances.bookingService.timeout-duration=2s

