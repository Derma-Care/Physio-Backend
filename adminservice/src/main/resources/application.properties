# =========================================================
# APPLICATION
# =========================================================
spring.application.name=adminservice
server.port=8081

# =========================================================
# SERVER (local dev)
# =========================================================
server.connection-timeout=90s
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Compression (optional in local)
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain
server.compression.min-response-size=1024

# =========================================================
# EUREKA (local discovery)
# =========================================================
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# =========================================================
# MONGODB (local DB)
# =========================================================
spring.data.mongodb.uri=mongodb://localhost:27017/AdminService?connectTimeoutMS=30000&socketTimeoutMS=60000

# =========================================================
# STATIC FILES (local folders)
# =========================================================
spring.mvc.static-path-pattern=/derma-care/media/**
spring.web.resources.static-locations=file:videos/,file:images/
app.video.folder=videos/
app.video.base-url=http://localhost:8081/derma-care/media/videos/
app.image.folder=images/
app.image.base-url=http://localhost:8081/derma-care/media/images/

# =========================================================
# MAIL (dummy creds for local)
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=local-test@gmail.com
spring.mail.password=dummy-password
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
spring.mail.debug=true   # enable debug locally

# =========================================================
# FEIGN TIMEOUTS (longer for debugging)
# =========================================================
spring.cloud.openfeign.client.config.default.connectTimeout=30000
spring.cloud.openfeign.client.config.default.readTimeout=60000
spring.cloud.openfeign.client.config.default.loggerLevel=FULL

# =========================================================
# RESILIENCE4J (relaxed thresholds for local)
# =========================================================
resilience4j.circuitbreaker.instances.circuitBreaker.failure-rate-threshold=80
resilience4j.circuitbreaker.instances.circuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.circuitBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.circuitBreaker.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.circuitBreaker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.circuitBreaker.permitted-number-of-calls-in-half-open-state=4
resilience4j.circuitbreaker.instances.circuitBreaker.wait-duration-in-open-state=30s

# =========================================================
# RESILIENCE4J TIME LIMITER
# =========================================================
resilience4j.timelimiter.instances.circuitBreaker.timeout-duration=120s

# =========================================================
# ACTUATOR (local monitoring)
# =========================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.mail.enabled=false

# =========================================================
# LOGGING (verbose for dev)
# =========================================================
logging.level.root=INFO
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.com.adminservice=DEBUG
