spring:
  application:
    name: customerservice

  data:
    mongodb:
      uri: mongodb://localhost:27017/customerService?connectTimeoutMS=30000&socketTimeoutMS=60000

  mvc:
    async:
      request-timeout: 60000

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 30000

            readTimeout: 60000					
#  config:
#   import: optional:classpath:application-secrets.yml  

server:
  port: 8083

  servlet:
    context-path: /api

  tomcat:
    connection-timeout: 60s

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true

    healthcheck:
      enabled: true

    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# ===============================
# Resilience4j
# ===============================

resilience4j:
  circuitbreaker:
    instances:
      customerService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        automatic-transition-from-open-to-half-open-enabled: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        record-exceptions:
                - java.lang.Exception
                - feign.FeignException
        ignore-exceptions:
                - java.lang.IllegalArgumentException

  retry:
   instances:
    customerService:
    max-attempts: 3
    wait-duration: 2s

  timelimiter:
    instances:
      customerService:
        timeout-duration: 60s

  ratelimiter:
    instances:
     customerService:
      limit-for-period: 50
      limit-refresh-period: 1m
      timeout-duration: 1s

# ===============================
# Actuator
# ===============================
management:
  server:
    base-path: /

  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# ===============================
# AWS S3
# ===============================

aws:
   accessKeyId:     
   secretAccessKey: 
   region: ap-south-1
   s3:
    bucket: physiocare-prod-storage

