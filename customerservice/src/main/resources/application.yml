spring:
  application:
    name: customerservice

  data:
    mongodb:
      uri: mongodb://localhost:27017/customerService?connectTimeoutMS=30000&socketTimeoutMS=60000

    redis:
      host: localhost
      port: 6379
#     password: your-password

  mvc:
    async:
      request-timeout: 60000

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 30000
            readTimeout: 60000

#  config:
#    import: optional:classpath:application-secrets.yml

server:
  port: 8083

  servlet:
    context-path: /api

  tomcat:
    connection-timeout: 60s

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true

    healthcheck:
      enabled: true

    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# ===============================
# Resilience4j
# ===============================

resilience4j:

  circuitbreaker:
    instances:

      adminService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        automatic-transition-from-open-to-half-open-enabled: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        record-exceptions:
          - java.lang.Exception
          - feign.FeignException
        ignore-exceptions:
          - java.lang.IllegalArgumentException

      clinicAdminadminService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        automatic-transition-from-open-to-half-open-enabled: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        record-exceptions:
          - java.lang.Exception
          - feign.FeignException
        ignore-exceptions:
          - java.lang.IllegalArgumentException

      notificationService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        automatic-transition-from-open-to-half-open-enabled: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        record-exceptions:
          - java.lang.Exception
          - feign.FeignException
        ignore-exceptions:
          - java.lang.IllegalArgumentException

      physioDoctorService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        automatic-transition-from-open-to-half-open-enabled: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        record-exceptions:
          - java.lang.Exception
          - feign.FeignException
        ignore-exceptions:
          - java.lang.IllegalArgumentException

      keycloak:
        register-health-indicator: true
        failure-rate-threshold: 50
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        minimum-number-of-calls: 5
        automatic-transition-from-open-to-half-open-enabled: true
        permitted-number-of-calls-in-half-open-state: 4
        wait-duration-in-open-state: 1m

        record-exceptions:
          - java.lang.Exception
          - feign.FeignException
          - java.io.IOException
          - java.util.concurrent.TimeoutException

        ignore-exceptions:
          - java.lang.IllegalArgumentException
          - org.springframework.web.bind.MethodArgumentNotValidException
          - org.springframework.web.server.ResponseStatusException

  retry:
    instances:

      adminService:
        max-attempts: 3
        wait-duration: 2s

      clinicAdminService:
        max-attempts: 3
        wait-duration: 2s

      notificationService:
        max-attempts: 3
        wait-duration: 2s

      physioDoctorService:
        max-attempts: 3
        wait-duration: 2s

      keycloak:
        max-attempts: 3
        wait-duration: 2s

  timelimiter:
    instances:

      bookingService:
        timeout-duration: 60s

      clinicAdminService:
        timeout-duration: 60s

      notificationService:
        timeout-duration: 60s

      physioDoctorService:
        timeout-duration: 60s

  ratelimiter:
    instances:

      keycloak:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 2s

# ===============================
# Actuator
# ===============================

management:
  server:
    base-path: /

  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# ===============================
# AWS S3
# ===============================

aws:
  accessKeyId:
  secretAccessKey:
  region: ap-south-1

  s3:
    bucket: physiocare-prod-storage

