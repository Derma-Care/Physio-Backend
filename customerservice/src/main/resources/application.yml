spring:
  application:
    name: customerservice

  data:
    mongodb:
      uri: mongodb://localhost:27017/customerService?connectTimeoutMS=30000&socketTimeoutMS=60000

  mvc:
    async:
      request-timeout: 60000   # longer for debugging

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 30000
            readTimeout: 60000
            loggerLevel: FULL   # verbose logs for dev

server:
  port: 8083
  servlet:
    context-path: /api
  tomcat:
    connection-timeout: 60s

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 15   # faster refresh in local
    lease-expiration-duration-in-seconds: 45

# ===============================
# Resilience4j (relaxed for local)
# ===============================
resilience4j:
  circuitbreaker:
    instances:
      circuitBreaker:
        failure-rate-threshold: 80
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        minimum-number-of-calls: 3
        automatic-transition-from-open-to-half-open-enabled: true
        permitted-number-of-calls-in-half-open-state: 4
        wait-duration-in-open-state: 30s   # shorter for local testing

# ===============================
# Actuator
# ===============================
management:
  server:
    base-path: /
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# ===============================
# AWS S3 (dummy for local)
# ===============================
aws:
  accessKeyId: local-access
  secretAccessKey: local-secret
  region: ap-south-1
  s3:
    bucket: physiocare-dev-storage

# ===============================
# Firebase (local key)
# ===============================
app:
  firebase-configuration-file: firebase-key.json

# ===============================
# Logging (verbose for dev)
# ===============================
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.sureCare.CustomerService: DEBUG
