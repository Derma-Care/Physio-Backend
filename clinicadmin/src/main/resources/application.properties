# ===============================
# Application
# ===============================
spring.application.name=clinicadmin
server.port=8080

# ===============================
# Eureka (local discovery)
# ===============================
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.healthcheck.enabled=false
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# ===============================
# MongoDB (local dev DB)
# ===============================
spring.data.mongodb.uri=mongodb://localhost:27017/clinicadminservice?connectTimeoutMS=30000&socketTimeoutMS=60000

# ===============================
# Server Timeouts
# ===============================
server.tomcat.connection-timeout=60s
spring.mvc.async.request-timeout=60000

# ===============================
# Actuator (local monitoring)
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

# ===============================
# Mail Configuration (dummy for local)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=physiocare478@gmail.com
spring.mail.password=erxdwlclzksbbrfo
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.debug=true   # enable debug locally


# ===============================
# Application Base URL+
# ===============================
app.base-url=https://dr.tarun-api.chiselontestserver.xyz

# ===============================
# Resilience4j (local testing thresholds)
# ===============================
spring.cloud.circuitbreaker.resilience4j.enabled=true
resilience4j.circuitbreaker.instances.serviceCircuitBreaker.register-health-indicator=true
resilience4j.circuitbreaker.instances.serviceCircuitBreaker.sliding-window-size=5
resilience4j.circuitbreaker.instances.serviceCircuitBreaker.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.serviceCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.serviceCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.serviceCircuitBreaker.failure-rate-threshold=50

# ===============================
# AWS S3 (dummy for local)
# ===============================
aws.access-key=local-access
aws.secret-key=local-secret
aws.region=ap-south-1
aws.s3.bucket=physiocare-dev-storage

# ===============================
# Firebase (local key)
# ===============================
app.firebase-configuration-file=firebase-key.json

# ===============================
# WhatsApp (dummy for local)
# ===============================
whatsapp.base-url=http://localhost:8080/mock-whatsapp
whatsapp.auth-key=dummy-key
whatsapp.phone-number-id=test-id
whatsapp.single-user-notification-template-id=test-template

# ===============================
# Logging (verbose for dev)
# ===============================
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.com.clinicadmin=DEBUG

# ===============================
# OpenFeign Timeouts (longer for debugging)
# ===============================
spring.cloud.openfeign.client.config.default.connectTimeout=30000
spring.cloud.openfeign.client.config.default.readTimeout=60000
spring.cloud.openfeign.client.config.default.loggerLevel=FULL
