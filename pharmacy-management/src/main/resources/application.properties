# ===============================
# Application
# ===============================
spring.application.name=pharmacy-management

# ===============================
# Server
# ===============================
server.port=8801
server.servlet.context-path=/api/pharmacy

# ===============================
# MongoDB
# ===============================
spring.data.mongodb.uri=mongodb://localhost:27017/PharmacyManagement?connectTimeoutMS=30000&socketTimeoutMS=60000

# ===============================
# Eureka Client
# ===============================
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info,metrics

# ===============================
# Mail Configuration
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8

# ===============================
# OpenFeign Timeouts
# ===============================
spring.cloud.openfeign.client.config.default.connectTimeout=30000
spring.cloud.openfeign.client.config.default.readTimeout=60000

# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.com.pharmacyManagement=DEBUG

# ===============================
# Jackson
# ===============================
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.time-zone=Asia/Kolkata