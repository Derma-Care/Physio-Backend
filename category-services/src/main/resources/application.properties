# =========================================================
# APPLICATION
# =========================================================

spring.application.name=category-services

server.port=8800

server.servlet.context-path=/api

# =========================================================
# SERVER
# =========================================================

server.connection-timeout=90s

server.shutdown=graceful

spring.lifecycle.timeout-per-shutdown-phase=30s

# Compression
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain
server.compression.min-response-size=1024

# =========================================================
# MONGODB
# =========================================================

spring.data.mongodb.uri=mongodb://localhost:27017/category-services?connectTimeoutMS=30000&socketTimeoutMS=60000

# =========================================================
# EUREKA
# =========================================================

eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true

# =========================================================
# FEIGN
# =========================================================

spring.cloud.openfeign.client.config.default.connectTimeout=30000

spring.cloud.openfeign.client.config.default.readTimeout=60000

# =========================================================
# RESILIENCE4J
# =========================================================

resilience4j.circuitbreaker.instances.categoryService.register-health-indicator=true

resilience4j.circuitbreaker.instances.categoryService.sliding-window-size=10

resilience4j.circuitbreaker.instances.categoryService.minimum-number-of-calls=5

resilience4j.circuitbreaker.instances.categoryService.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.categoryService.wait-duration-in-open-state=10s

# =========================================================
# TIME LIMITER
# =========================================================

resilience4j.timelimiter.instances.categoryService.timeout-duration=60s

# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info,metrics

management.endpoint.health.show-details=always

# =========================================================
# LOGGING
# =========================================================

logging.level.root=INFO

logging.level.org.springframework.data.mongodb=INFO