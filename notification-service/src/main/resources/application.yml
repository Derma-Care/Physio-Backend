spring:
  application:
    name: notification-service

  data:
    mongodb:
      uri: mongodb://localhost:27017/DermaCareNotifications?connectTimeoutMS=30000&socketTimeoutMS=60000

  mvc:
    async:
      request-timeout: 60000   # longer for debugging

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 30000
            readTimeout: 60000
            loggerLevel: FULL   # verbose logs for dev

server:
  port: 9909
  servlet:
    context-path: /api
  tomcat:
    connection-timeout: 60s

# =========================================================
# Eureka (local discovery)
# =========================================================
eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

  client:
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

# =========================================================
# Actuator (local monitoring)
# =========================================================
management:
  server:
    base-path: /
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# =========================================================
# App Info
# =========================================================
info:
  app:
    name: notification-service
    description: Service responsible for handling notifications related to bookings (local profile)
    version: 1.0.0

# =========================================================
# Firebase (local key)
# =========================================================
app:
  firebase-configuration-file: firebase-key.json

# =========================================================
# Logging (verbose for dev)
# =========================================================
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.dermacare.notification_service: DEBUG
