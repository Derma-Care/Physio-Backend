# ===============================
# Application
# ===============================
spring.application.name=physiotherapydoctor-service

# ===============================
# Server Configuration
# ===============================
server.port=8888
server.servlet.context-path=/api

# ===============================
# Eureka Configuration
# ===============================
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.healthcheck.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# ===============================
# MongoDB Configuration
# ===============================
spring.data.mongodb.uri=mongodb://localhost:27017/physiotherapydoctorservice?connectTimeoutMS=30000&socketTimeoutMS=60000&serverSelectionTimeoutMS=30000

# ===============================
# OpenFeign Timeouts
# ===============================
spring.cloud.openfeign.client.config.default.connectTimeout=30000
spring.cloud.openfeign.client.config.default.readTimeout=60000

# ===============================
# Actuator Configuration
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.server.base-path=/

## ===============================
## AWS S3
## ===============================

#aws.region=ap-south-1
#aws.s3.bucket=physiocare-prod-storage

# ===============================
# Logging Configuration
# ===============================
logging.level.org.springframework.web=INFO
logging.level.physiotherapydoctor=DEBUG


