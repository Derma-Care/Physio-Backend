# ===============================
# Resilience4j
# ===============================
resilience4j.circuitbreaker.instances.physiotherapydoctorService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.physiotherapydoctorService.sliding-window-size=10
resilience4j.circuitbreaker.instances.physiotherapydoctorService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.physiotherapydoctorService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.physiotherapydoctorService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.physiotherapydoctorService.permitted-number-of-calls-in-half-open-state=4
resilience4j.circuitbreaker.instances.physiotherapydoctorService.wait-duration-in-open-state=1m

# Record these exceptions as failures
resilience4j.circuitbreaker.instances.physiotherapydoctorService.record-exceptions[0]=java.lang.Exception
resilience4j.circuitbreaker.instances.physiotherapydoctorService.record-exceptions[1]=feign.FeignException
resilience4j.circuitbreaker.instances.physiotherapydoctorService.record-exceptions[2]=java.io.IOException
resilience4j.circuitbreaker.instances.physiotherapydoctorService.record-exceptions[3]=java.util.concurrent.TimeoutException

# Ignore these exceptions
resilience4j.circuitbreaker.instances.physiotherapydoctorService.ignore-exceptions[0]=java.lang.IllegalArgumentException
resilience4j.circuitbreaker.instances.physiotherapydoctorService.ignore-exceptions[1]=org.springframework.web.bind.MethodArgumentNotValidException
resilience4j.circuitbreaker.instances.physiotherapydoctorService.ignore-exceptions[2]=org.springframework.web.server.ResponseStatusException

resilience4j.retry.instances.physiotherapydoctorService.max-attempts=3
resilience4j.retry.instances.physiotherapydoctorService.wait-duration=2s

resilience4j.ratelimiter.instances.physiotherapydoctorService.limit-for-period=20
resilience4j.ratelimiter.instances.physiotherapydoctorService.limit-refresh-period=1s
resilience4j.ratelimiter.instances.physiotherapydoctorService.timeout-duration=2s


