# ===============================
# Application
# ===============================
spring.application.name=physiotherapydoctor-service

# ===============================
# Server Configuration (local dev)
# ===============================
server.port=8888
server.servlet.context-path=/api
server.tomcat.connection-timeout=60s

# ===============================
# Eureka Configuration (local discovery)
# ===============================
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.healthcheck.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# ===============================
# MongoDB Configuration (local DB)
# ===============================
spring.data.mongodb.uri=mongodb://localhost:27017/physiotherapydoctorservice?connectTimeoutMS=30000&socketTimeoutMS=60000&serverSelectionTimeoutMS=30000

# ===============================
# OpenFeign Timeouts (longer for debugging)
# ===============================
spring.cloud.openfeign.client.config.default.connectTimeout=30000
spring.cloud.openfeign.client.config.default.readTimeout=60000
spring.cloud.openfeign.client.config.default.loggerLevel=FULL

# ===============================
# Actuator Configuration (local monitoring)
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.server.base-path=/

# ===============================
# WhatsApp (dummy values for local)
# ===============================
whatsapp.base-url=http://localhost:8080/mock-whatsapp
whatsapp.auth-key=dummy-key
whatsapp.phone-number-id=test-id
whatsapp.payment-confirmation-template-id=test-payment-template
whatsapp.followup-reminder-template-id=test-followup-template

# ===============================
# AWS S3 (test bucket for local dev)
# ===============================
aws.access-key=local-access
aws.secret-key=local-secret
aws.region=ap-south-1
aws.s3.bucket=physiocare-dev-storage

# ===============================
# Logging Configuration (verbose for dev)
# ===============================
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.physiotherapydoctor=DEBUG

spring.config.import=optional:classpath:application-secrets.properties