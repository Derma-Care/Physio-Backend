# ===============================
# Application
# ===============================
spring.application.name=doctor-service
server.port=8082
server.servlet.context-path=/api

# ===============================
# MongoDB
# ===============================
spring.data.mongodb.uri=mongodb://localhost:27017/dermacaredoctor-db?connectTimeoutMS=30000&socketTimeoutMS=60000

# ===============================
# Eureka
# ===============================
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.healthcheck.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# ===============================
# Server Timeouts
# ===============================
server.tomcat.connection-timeout=60s
spring.mvc.async.request-timeout=60000

# ===============================
# OpenFeign Timeouts
# ===============================
spring.cloud.openfeign.client.config.default.connectTimeout=30000
spring.cloud.openfeign.client.config.default.readTimeout=60000

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ===============================
# Logging
# ===============================
logging.level.org.springframework.web=INFO
logging.level.com.dermacare=DEBUG