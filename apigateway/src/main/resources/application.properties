
spring.application.name=apigateway
server.port=9090

# =========================================================
# REACTIVE APPLICATION
# =========================================================

spring.main.web-application-type=reactive

# =========================================================
# EUREKA
# =========================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

eureka.instance.prefer-ip-address=true

# ==========================================================
# GATEWAY TIMEOUTS
# ==========================================================

# HTTP Client Timeout
spring.cloud.gateway.httpclient.connect-timeout=30000
spring.cloud.gateway.httpclient.response-timeout=60s

# Connection Pool
spring.cloud.gateway.httpclient.pool.max-connections=500
spring.cloud.gateway.httpclient.pool.acquire-timeout=30000

# Netty
server.netty.idle-timeout=60s

# =========================================================
# ROUTES
# =========================================================

# ------------------------------- 0: Admin Service ---------------------------------------
spring.cloud.gateway.routes[0].id=admin-service
spring.cloud.gateway.routes[0].uri=lb://adminservice
spring.cloud.gateway.routes[0].predicates[0]=Path=/admin/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/admin/(?<segment>.*), /admin/${segment}


# ------------------------------- 1: Clinic Admin Service --------------------------------
spring.cloud.gateway.routes[1].id=clinic-admin-service
spring.cloud.gateway.routes[1].uri=lb://clinicadmin
spring.cloud.gateway.routes[1].predicates[0]=Path=/clinic-admin/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/clinic-admin/(?<segment>.*), /clinic-admin/${segment}


# ------------------------------- 4: Customer service --------------------------------------

spring.cloud.gateway.routes[2].id=customerservice
spring.cloud.gateway.routes[2].uri=lb://customerservice
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/customer/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/api/customer/(?<segment>.*), /api/customer/${segment}


# ------------------------------- 5: Physiotherapy Doctor Service ---------------------------

spring.cloud.gateway.routes[3].id=physiotherapydoctor-service
spring.cloud.gateway.routes[3].uri=lb://physiotherapydoctor-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/physiotherapy-doctor/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/api/physiotherapy-doctor/(?<segment>.*), /api/physiotherapy-doctor/${segment}

# ------------------------------- 5: S3 Service --------------------------------------

spring.cloud.gateway.routes[4].id=bookingservice
spring.cloud.gateway.routes[4].uri=lb://bookingservice
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/**
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/api/v1/(?<segment>.*), /api/v1/${segment}

# Allowed Origins
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins[0]= http://localhost:3000,http://localhost:3001,https://admin.ccmstestserver.online,https://clinic.ccmstestserver.online,https://doctor.ccmstestserver.online,https://patient.ccmstestserver.online,https://therapist.ccmstestserver.online
#spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins[1]=http://13.233.9.23:4000

# Allowed Methods
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods[0]=GET
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods[1]=POST
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods[2]=PUT
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods[3]=DELETE
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods[4]=PATCH
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods[5]=OPTIONS


# Allowed Headers (explicit instead of *)
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders[0]=Authorization
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders[1]=Content-Type
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders[2]=Accept

# Allow Credentials
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true

# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always

# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework.cloud.gateway=INFO
logging.level.reactor.netty=INFO
